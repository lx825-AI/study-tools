<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Flashcard 抽认卡</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/study.css">
<link rel="stylesheet" href="css/mode.css">
<link rel="stylesheet" href="css/preview.css">
<link rel="stylesheet" href="css/stats.css">
</head>
<body>

<div id="app">
  <header>
    <h1>📚 Flashcard 抽认卡</h1>
    <button class="theme-toggle" id="themeToggle" title="切换暗色模式">🌙</button>
  </header>

  <div class="deck-selector">
    <select id="deckSelect">
      <option value="">-- 请选择牌组 --</option>
    </select>
    <button class="btn btn-outline btn-sm" id="btnStudyNow">开始学习</button>
  </div>

  <nav class="top-nav">
    <button data-tab="decks" class="active">📦 牌组</button>
    <button data-tab="study">🔄 学习</button>
    <button data-tab="preview">📖 预览</button>
    <button data-tab="cards">✏️ 卡片</button>
    <button data-tab="stats">📊 统计</button>
    <button data-tab="wrong">📋 错词本</button>
  </nav>

  <!-- 牌组管理面板 -->
  <div id="panelDecks" class="panel visible">
    <div id="dailyQuoteCard" class="quote-card"></div>
    <div class="add-deck-form">
      <input id="deckNameInput" type="text" placeholder="输入牌组名称，例如「四级单词」" maxlength="30">
      <button class="btn btn-primary" id="btnAddDeck">创建</button>
    </div>
    <div class="import-area">
      <button class="btn btn-outline btn-sm" id="btnImportBook">📥 导入词书</button>
    </div>
    <div id="deckGrid" class="deck-grid"></div>
    <div id="decksEmpty" class="empty-state" style="display:none">
      <div class="icon">📭</div>
      <p>还没有牌组<br>在上方输入名称创建一个吧</p>
    </div>
  </div>

  <!-- 学习面板 -->
  <div id="panelStudy" class="panel">
    <div id="studyNoDeck" class="empty-state">
      <div class="icon">👆</div>
      <p>请先在顶部选择一个牌组</p>
    </div>
    <div id="studyContent" style="display:none">
      <div class="study-header">
        <button class="btn-back-mode" id="btnBackToMode" title="返回模式选择">← 返回</button>
        <div class="study-deck-name" id="studyDeckName"></div>
        <div class="study-progress" id="studyProgress"></div>
        <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
      </div>
      <div class="card-scene">
        <div class="flashcard" id="flashcard">
          <div class="card-face card-front">
            <div class="card-label">问题</div>
            <div class="card-text" id="cardFrontText"></div>
            <div class="speak-row">
              <button class="speak-btn" id="btnSpeak" title="朗读">🔊</button>
              <button class="accent-toggle" id="btnAccentToggle" title="切换美式/英式发音"><span id="accentLabel">🇺🇸</span></button>
            </div>
            <div class="card-hint">👆 点击卡片翻转查看答案</div>
          </div>
          <div class="card-face card-back">
            <div class="card-label">答案</div>
            <div class="card-text" id="cardBackText"></div>
            <div class="card-hint">👆 点击卡片翻回问题</div>
          </div>
        </div>
      </div>
      <div class="study-actions">
        <button class="btn btn-fail" id="btnFail">✗ 不会</button>
        <button class="btn btn-pass" id="btnPass">✓ 会了</button>
      </div>
      <!-- 拼写模式 -->
      <div class="spell-mode-section" id="spellModeSection" style="display:none">
        <div class="spell-toggle-row">
          <button class="btn btn-outline btn-sm" id="btnToggleSpell">⌨️ 拼写模式</button>
        </div>
        <div class="spell-input-area" id="spellInputArea" style="display:none">
          <div class="spell-hint">输入英文单词拼写：</div>
          <div class="spell-input-row">
            <input type="text" id="spellInput" placeholder="输入英文单词..." autocomplete="off">
            <button class="btn btn-primary btn-sm" id="btnSpellCheck">确认</button>
          </div>
          <div class="spell-feedback" id="spellFeedback"></div>
        </div>
      </div>
    </div>
    <div id="studyComplete" style="display:none">
      <div class="study-complete">
        <div class="icon">🎉</div>
        <h2 id="completeTitle"></h2>
        <p id="completeStats"></p>
        <button class="btn btn-primary" id="btnRestart">再来一轮</button>
      </div>
    </div>
    <div id="studyEmpty" class="empty-state" style="display:none">
      <div class="icon">📝</div>
      <p>这个牌组还没有卡片<br>切换到「卡片」标签页添加一些吧</p>
    </div>
  </div>

  <!-- 预览模式面板 -->
  <div id="panelPreview" class="panel">
    <div id="previewNoDeck" class="empty-state">
      <div class="icon">👆</div>
      <p>请先在顶部选择一个牌组</p>
    </div>
    <div id="previewContent" style="display:none">
      <div class="study-header">
        <div class="study-deck-name" id="previewDeckName"></div>
        <div class="study-progress">共 <span id="previewCount">0</span> 个单词</div>
      </div>
      <div class="preview-controls">
        <input type="text" id="previewSearch" placeholder="搜索单词...">
      </div>
      <div class="preview-scroll" style="overflow-x:auto">
        <table class="preview-table">
          <thead>
            <tr><th class="col-idx">#</th><th class="col-front">英文</th><th class="col-back">释义</th></tr>
          </thead>
          <tbody id="previewTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 卡片编辑面板 -->
  <div id="panelCards" class="panel">
    <div id="cardsNoDeck" class="empty-state">
      <div class="icon">👆</div>
      <p>请先在顶部选择一个牌组</p>
    </div>
    <div id="cardsContent" style="display:none">
      <div class="section-title" id="cardsCountTitle">卡片列表</div>
      <div class="cards-toolbar" id="cardsToolbar">
        <button class="btn btn-outline btn-sm" id="btnBatchMode">☐ 批量模式</button>
        <div class="batch-actions" id="batchActions" style="display:none">
          <button class="btn btn-outline btn-sm" id="btnSelectAll">全选</button>
          <button class="btn btn-outline btn-sm" id="btnDeselectAll">取消</button>
          <button class="btn btn-danger btn-sm" id="btnBatchDelete">删除选中</button>
        </div>
      </div>
      <div id="cardList" class="card-list"></div>
      <div class="add-card-form">
        <h3>添加新卡片</h3>
        <input id="cardFrontInput" type="text" placeholder="正面（问题/单词）" maxlength="200">
        <input id="cardBackInput" type="text" placeholder="反面（答案/释义）" maxlength="500">
        <button class="btn btn-primary btn-block" id="btnAddCard">添加卡片</button>
      </div>
    </div>
  </div>

  <!-- 统计面板 -->
  <div id="panelStats" class="panel">
    <div class="empty-state" style="padding:24px 20px">
      <p>统计数据将在学习中自动累积</p>
    </div>
  </div>

  <!-- 错词本面板 -->
  <div id="panelWrong" class="panel"></div>

  <!-- 底部移动端导航栏 -->
  <nav class="bottom-nav" id="bottomNav">
    <button data-tab="decks" class="active">
      <span class="bottom-nav-icon">📦</span>
      <span class="bottom-nav-label">牌组</span>
    </button>
    <button data-tab="study">
      <span class="bottom-nav-icon">🔄</span>
      <span class="bottom-nav-label">学习</span>
      <span class="nav-badge" style="display:none" id="studyBadgeMobile"></span>
    </button>
    <button data-tab="preview">
      <span class="bottom-nav-icon">📖</span>
      <span class="bottom-nav-label">预览</span>
    </button>
    <button data-tab="cards">
      <span class="bottom-nav-icon">✏️</span>
      <span class="bottom-nav-label">卡片</span>
    </button>
    <button data-tab="stats">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label">统计</span>
    </button>
    <button data-tab="wrong">
      <span class="bottom-nav-icon">📋</span>
      <span class="bottom-nav-label">错词本</span>
    </button>
  </nav>

  <!-- 导入词书弹窗 -->
  <div class="import-modal-overlay" id="importModal" style="display:none">
    <div class="import-modal" style="max-width:440px;width:calc(100% - 32px)">
      <h3>📥 导入词书</h3>
      <p>选择内置词书导入，已导入的不会重复添加</p>
      <div class="modal-options" id="importBookList"></div>
      <p id="importStatus" style="font-size:13px;margin-bottom:12px;min-height:20px;"></p>
      <button class="modal-cancel" id="btnModalCancel">取消</button>
    </div>
  </div>
</div>

<!-- JS 加载顺序：依赖关系 -->
<script src="js/idb-storage.js"></script>
<script src="js/state.js"></script>
<script src="js/models.js"></script>
<script src="js/utils.js"></script>
<script src="js/ebbinghaus.js"></script>
<script src="js/ui.js"></script>
<script src="js/daily-quote.js"></script>
<script src="js/deck-panel.js"></script>
<script src="js/quick-mode.js"></script>
<script src="js/study-panel.js"></script>
<script src="js/wrong-words.js"></script>
<script src="js/preview-panel.js"></script>
<script src="js/cards-panel.js"></script>
<script src="js/import.js"></script>
<script src="js/stats-panel.js"></script>
<script src="data/word-schema.js"></script>
<script src="js/app.js"></script>
<script>
/* 注册 Service Worker */
if ('serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) {}
}

/* 启动应用 */
FlashcardApp.init();
</script>

</body>
</html>
