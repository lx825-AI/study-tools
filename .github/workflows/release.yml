name: Release Apps

# 打 tag（v1.0.0）或在 Actions 页面手动运行，都会产出：
#   Windows 安装包 ×2（NSIS）
#   Android APK ×2（debug 签名，可侧载安装）
# 并汇总到一个 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 1.0.0；留空则用分支名兜底为 0.0.0-dev）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  desktop:
    name: Windows 安装包 — ${{ matrix.app }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: english
            project: web/English-web
            appdir: apps/desktop-english
          - app: math
            project: web/math-web
            appdir: apps/desktop-math
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then v="0.0.0-dev"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build web
        working-directory: ${{ matrix.project }}
        run: |
          npm ci
          npm run build

      - name: Install app dependencies
        working-directory: ${{ matrix.appdir }}
        run: npm ci

      - name: Set app version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/set-version.mjs

      - name: Package desktop app
        working-directory: ${{ matrix.appdir }}
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          # latest.yml + blockmap 必须一起上传：electron-updater 靠 latest.yml 判断新版本
          name: desktop-${{ matrix.app }}
          path: |
            dist-apps/desktop-${{ matrix.app }}/*.exe
            dist-apps/desktop-${{ matrix.app }}/latest.yml
            dist-apps/desktop-${{ matrix.app }}/*.blockmap
          if-no-files-found: error

  android:
    name: Android APK — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: english
            project: web/English-web
            appdir: apps/mobile-english
          - app: math
            project: web/math-web
            appdir: apps/mobile-math
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then v="0.0.0-dev"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Build web
        working-directory: ${{ matrix.project }}
        run: |
          npm ci
          npm run build

      - name: Install app dependencies
        working-directory: ${{ matrix.appdir }}
        run: npm ci

      - name: Set app version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/set-version.mjs

      - name: 准备 Android 签名（未配置 Secrets 时退回调试签名）
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ANDROID_KEYSTORE_BASE64，本次构建使用调试签名"
          fi

      - name: Build APK
        working-directory: ${{ matrix.appdir }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android

      - name: 校验 APK 签名
        shell: bash
        working-directory: ${{ matrix.appdir }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
        run: |
          apk=$(ls ../../dist-apps/*.apk | head -n 1)
          echo "APK: $apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > certs.txt 2>&1 || {
            echo "::error::APK 签名校验失败"; cat certs.txt; exit 1;
          }
          grep "Signer #1 certificate DN" certs.txt
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            grep -q "CN=Study Tools" certs.txt || { echo "::error::APK 未使用仓库固定签名"; exit 1; }
            echo "::notice::APK 已用固定签名，可在后续版本覆盖安装"
          else
            echo "::notice::未配置签名 Secrets，本次为调试签名"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: dist-apps/*.apk
          if-no-files-found: error

  release:
    name: 发布到 GitHub Releases
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
