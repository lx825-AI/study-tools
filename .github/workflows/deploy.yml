name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'english/English-web/**'
      - 'math/math-web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-all
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 测试 + 构建 English-web
      - name: Test & Build English-web
        run: |
          cd english/English-web
          npm ci
          npm test
          npm run build

      # 测试 + 构建 math-web
      - name: Test & Build math-web
        run: |
          cd math/math-web
          npm ci
          npm test
          npm run build

      # 合并产物 (用 _site 避免 .gitignore 中 dist/ 导致 upload-pages-artifact 跳过文件)
      - name: Merge dist
        run: |
          mkdir -p _site
          cp -r english/English-web/dist _site/english
          cp -r math/math-web/dist _site/math

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - id: deployment
        uses: actions/deploy-pages@v4
