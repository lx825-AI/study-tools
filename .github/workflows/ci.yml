name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  english:
    name: English-web — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english/English-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: english/English-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  math:
    name: math-web — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: math/math-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: math/math-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
