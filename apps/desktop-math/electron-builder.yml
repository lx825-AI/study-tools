appId: com.lx825.math
productName: 数学公式速查
directories:
  output: ../../dist-apps/desktop-math
files:
  - main.js
  - lib/**
  - package.json
  - bundle/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: MathReference-${version}-win-x64-setup.${ext}
# 自动更新：electron-updater 读取这里生成的 app-update.yml，从 GitHub Release 拉 latest.yml
publish:
  provider: github
  owner: lx825-AI
  repo: study-tools
  releaseType: release
